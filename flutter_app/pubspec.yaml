name: handybot
description: HandyBot — photo-first AI home repair assistant. Flutter port of the original Expo/React Native app.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Routing
  go_router: ^14.2.0

  # State
  provider: ^6.1.2

  # Networking
  http: ^1.2.1

  # Storage
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # Media
  image_picker: ^1.1.2
  image: ^4.2.0

  # Notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Cloud
  supabase_flutter: ^2.5.6

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
